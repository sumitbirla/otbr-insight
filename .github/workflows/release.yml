# Builds the Linux binaries and attaches them to a GitHub release whenever a
# version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The same job runs on every push and pull request to main as a build check,
# but only a tag publishes a release. Binaries are static (CGO disabled, assets
# embedded), so a download is the whole install.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build release binaries
        run: make release

      - name: Checksums
        working-directory: dist
        run: sha256sum otbr-insight-linux-amd64 otbr-insight-linux-arm64 > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/otbr-insight-linux-amd64
            dist/otbr-insight-linux-arm64
            dist/SHA256SUMS
